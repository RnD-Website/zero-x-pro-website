<title>Zero X Pro Site</title>
<link rel="stylesheet" href="dialkit.css">
<style>
:root{--hero:url(drone.jpg);--snow:url(snow.jpg);--bg:#fbfbfb;--ink:#1e2a32;--mute:#a4acb1;--line:#d9dde0;--pale:#dfe6e9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;background:var(--bg);scrollbar-width:none}html::-webkit-scrollbar{display:none}html{overflow-y:auto}#vp{position:fixed;left:0;top:0;transform-origin:0 0}#cursor{display:none!important}#spacer{width:1px;height:9500px}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:clip}
body{font-family:'Inter Display','Inter',sans-serif;color:var(--ink);font-weight:400;letter-spacing:-.045em;-webkit-font-smoothing:antialiased}
#vp{width:1920px;height:1080px;overflow:hidden;overflow:clip;background:var(--bg)}
.mono{font-family:'DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;color:#59646b}
.abs{position:absolute}
#actor{position:absolute;overflow:hidden;z-index:0;will-change:transform}
#actor .img{position:absolute;left:0;top:0;background-repeat:no-repeat;background-image:var(--hero)}
#page{position:absolute;left:0;top:0;width:1920px;z-index:1;will-change:transform}
.hl{position:absolute;background:var(--line)}
.h-big{position:absolute;white-space:nowrap;font-weight:300;letter-spacing:-.065em;line-height:1;color:var(--ink)}
.scrub{position:absolute;letter-spacing:-.05em;line-height:1.08}
.scrub .w{display:inline-block;white-space:nowrap}
.badge{position:absolute;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;font-family:'DejaVu Sans Mono',monospace;font-size:10px;display:flex;align-items:center;justify-content:center;color:#59646b;background:var(--bg)}
#hdr{position:absolute;left:0;top:0;width:1920px;height:116px;z-index:10;background:rgba(251,251,251,.97)}
#hdr .t{position:absolute;top:47px;font-size:20px;line-height:24px;letter-spacing:-.035em;white-space:nowrap}
#hdr .g{color:#7b868d}
#h1,#h2,#h3,#hdot{display:none}#menu{position:absolute;left:1848px;top:37px;width:42px;height:42px;background:#eceeef;border:0;border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0;transition:background .25s}
#menu:hover{background:#e1e5e7}
#menu svg{width:40px;height:40px;display:block;overflow:visible}
#menu path{stroke:currentColor;transform-box:view-box;transform-origin:20px 20px;transition:transform .45s cubic-bezier(.7,0,.2,1)}
#vp.navopen #menu path.m1{transform:rotate(45deg) translateY(5.83px)}
#vp.navopen #menu path.m2{transform:rotate(-45deg) translateY(-5.83px)}
#vp.navopen #hdr{background:transparent}
#nav{position:absolute;inset:0;z-index:9;background:var(--bg);clip-path:inset(0 0 100% 0);transition:clip-path .7s cubic-bezier(.7,0,.2,1);pointer-events:none;overflow:hidden;overflow:clip}
#vp.navopen #nav{clip-path:inset(0 0 0 0);pointer-events:auto}
#nav .list{position:absolute;left:30px;top:170px;display:flex;flex-direction:column}
#nav a{display:flex;align-items:baseline;gap:34px;height:96px;font-size:84px;font-weight:300;letter-spacing:-.06em;line-height:96px;color:var(--ink);text-decoration:none;cursor:pointer;opacity:0;transform:translateY(40px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1),color .25s,padding .3s}
#nav a .n{font-family:'DejaVu Sans Mono',monospace;font-size:11px;letter-spacing:.06em;color:#59646b;width:28px;transform:translateY(-34px)}
#vp.navopen #nav a{opacity:1;transform:none}
#nav .list:hover a{color:var(--mute)}
#nav .list a:hover{color:var(--ink);padding-left:18px}
#nav .side{position:absolute;right:30px;bottom:44px;text-align:right;color:#59646b}
#nav .hl2{position:absolute;left:30px;right:30px;top:116px;height:1px;background:var(--line)}

#sb{position:absolute;right:3px;top:0;width:8px;height:1080px;z-index:12}
#sb i{position:absolute;left:0;width:8px;border-radius:4px;background:#59636a}
#loader{position:absolute;inset:0;z-index:20;background:var(--bg)}
#cursor{position:absolute;left:0;top:0;z-index:30;width:24px;height:24px;pointer-events:none}
.tab{position:absolute;font-size:62px;letter-spacing:-.06em;font-weight:300;white-space:nowrap;line-height:1}
.chip{position:absolute;height:26px;border:1px solid var(--line);border-radius:13px;padding:0 12px;display:flex;align-items:center;background:var(--bg)}
.cell{position:absolute;border-top:1px solid var(--line);background:transparent}
.cell.r{padding-left:34px;border-left:1px solid var(--line)}
.cell .k{position:absolute;left:0;top:18px;display:flex;align-items:center;gap:8px;font-size:9.5px;color:#7b868d}.cell.r .k{left:34px}
.cell .k:before{content:'';width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.55}
.cell .v{position:absolute;left:0;top:40px;font-size:46px;font-weight:300;letter-spacing:-.055em;line-height:1;white-space:nowrap;color:var(--ink)}.cell.r .v{left:34px}
.cell .v em{font-style:normal;font-size:20px;letter-spacing:-.03em;color:#7b868d;margin-left:7px;font-weight:400}
.gridend{position:absolute;height:1px;background:var(--line)}
.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--ink)}

#dkb{position:fixed;right:16px;bottom:16px;z-index:100;height:38px;padding:0 16px;border:0;border-radius:19px;background:#12171a;color:#fff;font:600 13px system-ui;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#dk{position:fixed;right:16px;bottom:64px;z-index:100;width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;overscroll-behavior:contain;background:rgba(18,23,26,.96);color:#e8edef;font:12px/1.4 system-ui,sans-serif;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:none;letter-spacing:0}
#dk.open{display:block}
#dk header{position:sticky;top:0;background:#12171a;padding:12px 14px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
#dk header button,#dk .btn{background:#2a3338;color:#fff;border:0;border-radius:6px;padding:6px 10px;font:12px system-ui;cursor:pointer}
#dk details{border-top:1px solid #2a3338}
#dk summary{padding:10px 14px;cursor:pointer;font-weight:600;color:#cfd8dc}
#dk .r{display:flex;flex-direction:column;gap:4px;padding:6px 14px}
#dk .r span{color:#8c979d;font-size:11px;display:flex;justify-content:space-between}
#dk input[type=text],#dk textarea{width:100%;background:#1c2327;color:#fff;border:1px solid #2f3a40;border-radius:6px;padding:6px 8px;font:12px system-ui;resize:vertical}
#dk input[type=range]{width:100%}
#dk input[type=color]{width:100%;height:28px;border:0;background:none;padding:0}
#dk input[type=file]{font-size:11px;color:#8c979d;width:100%}
#dk .row2{display:flex;gap:8px;padding:10px 14px}
#dk pre{margin:0 14px 12px;padding:8px;background:#1c2327;border-radius:6px;white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:auto;font:11px ui-monospace,monospace}
.vd{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;background:#111}.ov{position:absolute;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.ov.mono{color:#fff}

 pm=JSON.parse(JSON.stringify(v));
});

/* ---------- Media ---------- */
let pd=null;
const setVid=(el,src)=>{if(!el)return;el.src=src;const p=el.play();if(p&&p.catch)p.catch(()=>{})};
const mediaKit=DialKit.createDialKit('Media',{
 Images:{'Main image':{type:'image',options:['drone.jpg','snow.jpg'],default:'drone.jpg'},'Image after hero':{type:'image',options:['snow.jpg','drone.jpg'],default:'snow.jpg'}},
 Videos:{'Header video':sel('clip-hero.mp4'),'Tab 1 video':sel('clip-landscape.mp4'),'Tab 2 video':sel('clip-cinema.mp4'),'Tab 3 video':sel('clip-survey.mp4'),'Tab 4 video':sel('clip-snow.mp4'),'Full-width panel':sel('clip-aerial.mp4'),'Footer banner':sel('clip-valley.mp4'),_collapsed:true}
});
mediaKit.subscribe(v=>{
 if(pd){
  const I=v.Images,i0=pd.Images,V=v.Videos,v0=pd.Videos;
  if(I['Main image']!==i0['Main image']){const u=I['Main image'];const im=new Image();im.onload=()=>{IW=im.naturalWidth;IH=im.naturalHeight;rootStyle.setProperty('--hero','url("'+u+'")')};im.src=u}
  if(I['Image after hero']!==i0['Image after hero'])rootStyle.setProperty('--snow','url("'+I['Image after hero']+'")');
  if(V['Header video']!==v0['Header video'])setVid(document.getElementById('hv'),V['Header video']);
  [0,1,2,3].forEach(i=>{const k='Tab '+(i+1)+' video';if(V[k]!==v0[k])setVid(L.tb[i].vid,V[k])});
  if(V['Full-width panel']!==v0['Full-width panel'])setVid(document.getElementById('tvid'),V['Full-width panel']);
  if(V['Footer banner']!==v0['Footer banner'])setVid(document.getElementById('fbg'),V['Footer banner']);
 }
 pd=JSON.parse(JSON.stringify(v));
});
window.__dialkit={root,copyKit,styleKit,motionKit,mediaKit};
})();
